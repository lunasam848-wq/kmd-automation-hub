version: '3.9'

services:
  kmd-automation:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: kmd-automation-prod
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=King Mave Digital Automation Hub
      - APP_ENV=production
      - DATABASE_URL=sqlite:///./data/kmd.db
      - WHATSAPP_TOKEN=${WHATSAPP_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_WEBHOOK_VERIFY_TOKEN=${WHATSAPP_WEBHOOK_VERIFY_TOKEN}
      - SCHEDULER_ENABLED=true
    volumes:
      - ./data:/app/data
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
